<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>વર્નિયર કેલિપર સિમ્યુલેટર - Instructor: Yuvrajsinh Kosamia</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #e2e8f0;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      max-width: 850px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 24px;
      border: 1px solid #cbd5e1;
    }
    .header {
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 22px;
      color: #1e293b;
    }
    .badge {
      background-color: #1e40af;
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .canvas-card {
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 320px;
      display: block;
      background: #fafafa;
    }
    
    /* ચોક્કસ ગણતરી બોર્ડ (Formula Section) */
    .calc-card {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .calc-title {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 6px;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .formula-box {
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      text-align: center;
    }
    .formula-box .label {
      font-size: 12px;
      color: #64748b;
      font-weight: bold;
    }
    .formula-box .val {
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
      margin-top: 4px;
    }
    .formula-result {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #1d4ed8;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .slider {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #cbd5e1;
      outline: none;
      accent-color: #2563eb;
      cursor: pointer;
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .btn {
      background: #f1f5f9;
      border: 1px solid #94a3b8;
      color: #0f172a;
      padding: 10px 0;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover {
      background: #cbd5e1;
    }
    .btn-reset {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fca5a5;
    }
    .btn-reset:hover {
      background: #fecaca;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>વર્નિયર કેલિપર સિમ્યુલેટર</h1>
      <small style="color: #64748b;">લઘુત્તમ માપશક્તિ (Least Count - LC): 0.02 mm</small>
    </div>
    <div class="badge">
      Instructor: Yuvrajsinh Kosamia
    </div>
  </div>

  <div class="canvas-card">
    <canvas id="caliperCanvas"></canvas>
  </div>

  <!-- ચોક્કસ માપન ગણતરી સેક્શન -->
  <div class="calc-card">
    <div class="calc-title">📊 ગણતરી (Formula): Total = MSR + (VSD × LC)</div>
    
    <div class="formula-grid">
      <div class="formula-box">
        <div class="label">1. Main Scale (MSR)</div>
        <div class="val" id="msrVal">0.00 mm</div>
      </div>
      <div class="formula-box">
        <div class="label">2. Vernier Division (VSD)</div>
        <div class="val" id="vsdVal">0 મો કાપો</div>
      </div>
      <div class="formula-box">
        <div class="label">3. Least Count (LC)</div>
        <div class="val">0.02 mm</div>
      </div>
    </div>

    <div class="formula-result" id="finalFormula">
      કુલ માપ = 0.00 + (0 × 0.02) = 0.00 mm
    </div>
  </div>

  <div class="controls">
    <input type="range" id="slider" class="slider" min="0" max="50" step="0.02" value="0.00">
    
    <div class="btn-group">
      <button class="btn" onclick="addVal(-1.00)">-1.00</button>
      <button class="btn" onclick="addVal(-0.02)">-0.02</button>
      <button class="btn btn-reset" onclick="resetVal()">0.00</button>
      <button class="btn" onclick="addVal(0.02)">+0.02</button>
      <button class="btn" onclick="addVal(1.00)">+1.00</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('caliperCanvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slider');

  let reading = 0.00;

  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 2;
    canvas.width = canvas.clientWidth * ratio;
    canvas.height = 320 * ratio;
    ctx.scale(ratio, ratio);
    draw();
  }

  window.addEventListener('resize', resizeCanvas);

  function updateReading(val) {
    reading = Math.min(Math.max(parseFloat(val), 0), 50);
    reading = Math.round(reading * 50) / 50; // 0.02 precision
    slider.value = reading.toFixed(2);

    const msr = Math.floor(reading);
    const vsr = parseFloat((reading - msr).toFixed(2));
    const vsd = Math.round(vsr / 0.02);

    document.getElementById('msrVal').innerText = msr.toFixed(2) + " mm";
    document.getElementById('vsdVal').innerText = vsd + " મો કાપો";
    
    document.getElementById('finalFormula').innerText = 
      `કુલ માપ = ${msr.toFixed(2)} + (${vsd} × 0.02) = ${reading.toFixed(2)} mm`;

    draw();
  }

  function addVal(delta) {
    updateReading(reading + delta);
  }

  function resetVal() {
    updateReading(0.00);
  }

  slider.addEventListener('input', (e) => updateReading(e.target.value));

  function draw() {
    const w = canvas.clientWidth;
    const h = 320;
    ctx.clearRect(0, 0, w, h);

    // Scaling Parameters (Ultra-Clean Zoomed Scale)
    const pxPerMM = 14; 
    const startX = 140;
    const mainY = 60;
    const beamH = 50;
    const centerY = mainY + beamH; // 110

    // 1. MAIN BEAM (Metallic Finish)
    let beamGrad = ctx.createLinearGradient(0, mainY, 0, mainY + beamH);
    beamGrad.addColorStop(0, '#e2e8f0');
    beamGrad.addColorStop(0.5, '#ffffff');
    beamGrad.addColorStop(1, '#cbd5e1');

    ctx.fillStyle = beamGrad;
    ctx.fillRect(10, mainY, w - 20, beamH);
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(10, mainY, w - 20, beamH);

    // FIXED JAW (Left Side)
    ctx.beginPath();
    ctx.moveTo(startX, centerY);
    ctx.lineTo(startX, centerY + 130);
    ctx.lineTo(startX - 25, centerY + 130);
    ctx.lineTo(startX - 45, centerY + 40);
    ctx.lineTo(startX - 45, mainY - 40);
    ctx.lineTo(startX - 20, mainY - 40);
    ctx.lineTo(startX - 20, mainY);
    ctx.lineTo(10, mainY);
    ctx.lineTo(10, centerY);
    ctx.closePath();
    ctx.fillStyle = beamGrad;
    ctx.fill();
    ctx.stroke();

    // Instructor Branding
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'left';
    ctx.fillText("Instructor: Yuvrajsinh Kosamia", 20, mainY - 12);

    // MAIN SCALE GRADUATIONS (Facing Downwards)
    for (let i = 0; i <= 60; i++) {
      let x = startX + (i * pxPerMM);
      if (x < w - 20) {
        let isMajor = i % 10 === 0;
        let isMedium = i % 5 === 0;
        let lineH = isMajor ? 26 : (isMedium ? 18 : 12);

        ctx.beginPath();
        ctx.moveTo(x, centerY);
        ctx.lineTo(x, centerY - lineH);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = isMajor ? 2 : 1.2;
        ctx.stroke();

        if (isMajor) {
          ctx.fillStyle = '#000000';
          ctx.font = 'bold 13px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(i / 10, x, centerY - 30);
        }
      }
    }

    // 2. MOVABLE SLIDER & VERNIER SCALE
    let sliderX = startX + (reading * pxPerMM);

    // Movable Jaw Shape
    ctx.beginPath();
    ctx.moveTo(sliderX - 20, mainY - 10);
    ctx.lineTo(sliderX + 220, mainY - 10);
    ctx.lineTo(sliderX + 220, centerY + 40);
    ctx.lineTo(sliderX + 30, centerY + 40);
    ctx.lineTo(sliderX, centerY + 130);
    ctx.lineTo(sliderX - 25, centerY + 130);
    ctx.lineTo(sliderX - 20, mainY - 10);
    ctx.closePath();
    ctx.fillStyle = beamGrad;
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Vernier Scale Window
    const winW = 190;
    const winH = 34;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sliderX, centerY, winW, winH);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(sliderX, centerY, winW, winH);

    // Lock Screw Top
    ctx.fillStyle = '#64748b';
    ctx.fillRect(sliderX + 80, mainY - 22, 24, 12);
    ctx.strokeRect(sliderX + 80, mainY - 22, 24, 12);

    // VERNIER SCALE GRADUATIONS (Facing Upwards - Face to Face)
    // 50 Divisions = 49 mm -> 0.98 ratio
    const activeDiv = Math.round(((reading % 1).toFixed(2)) / 0.02);

    for (let j = 0; j <= 50; j++) {
      let vx = sliderX + (j * 0.98 * (pxPerMM / 5)); // 5 divisions per mm
      if (vx <= sliderX + winW) {
        let isMajor = j % 5 === 0;
        let isMatch = (j === activeDiv);
        let lineH = isMajor ? 20 : 12;

        ctx.beginPath();
        ctx.moveTo(vx, centerY);
        ctx.lineTo(vx, centerY + lineH);
        
        if (isMatch) {
          ctx.strokeStyle = '#dc2626'; // Coinciding Red Line
          ctx.lineWidth = 2.8;
        } else {
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = isMajor ? 1.6 : 1;
        }
        ctx.stroke();

        // Vernier Digits (0 to 10)
        if (isMajor) {
          ctx.fillStyle = isMatch ? '#dc2626' : '#000000';
          ctx.font = 'bold 11px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(j / 5, vx, centerY + 28);
        }

        // Matching Arrow Marker
        if (isMatch) {
          ctx.beginPath();
          ctx.moveTo(vx, centerY + 31);
          ctx.lineTo(vx - 4, centerY + 37);
          ctx.lineTo(vx + 4, centerY + 37);
          ctx.closePath();
          ctx.fillStyle = '#dc2626';
          ctx.fill();
        }
      }
    }

    // Zero Arrow Pointer
    ctx.beginPath();
    ctx.moveTo(sliderX, centerY - 2);
    ctx.lineTo(sliderX - 5, centerY - 10);
    ctx.lineTo(sliderX + 5, centerY - 10);
    ctx.closePath();
    ctx.fillStyle = '#dc2626';
    ctx.fill();
  }

  // Initial Load
  setTimeout(() => {
    resizeCanvas();
    updateReading(0.00);
  }, 100);
</script>

</body>
</html>
