<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>વર્નિયર કેલિપર HD સિમ્યુલેટર (0.02 mm LC)</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .container {
      background: #1e293b;
      max-width: 600px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 20px;
      border: 1px solid #334155;
    }
    .header-tag {
      background-color: #3b82f6;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 12px;
    }
    .title-section h1 {
      font-size: 22px;
      color: #f8fafc;
      margin-bottom: 4px;
    }
    .title-section p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .canvas-card {
      background: #000000;
      border: 2px solid #475569;
      border-radius: 12px;
      padding: 6px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 220px;
      display: block;
      background: #ffffff;
      border-radius: 6px;
    }
    .result-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .result-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
      margin-bottom: 10px;
    }
    .result-title {
      font-size: 16px;
      font-weight: 700;
      color: #cbd5e1;
    }
    .result-value {
      font-size: 28px;
      font-weight: 800;
      color: #38bdf8;
    }
    .calc-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    .calc-row strong {
      color: #f8fafc;
    }
    .highlight-red {
      color: #ef4444;
      font-weight: bold;
    }
    .highlight-blue {
      color: #38bdf8;
      font-weight: bold;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .btn {
      background: #334155;
      border: 1px solid #475569;
      color: #ffffff;
      padding: 10px 0;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn:active {
      background: #3b82f6;
    }
    .slider {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #475569;
      outline: none;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .reset-btn {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      color: #fecaca;
      padding: 10px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-tag">⚙️ High-Precision Mechanical Simulator</div>
  
  <div class="title-section">
    <h1>વર્નિયર કેલિપર સિમ્યુલેટર</h1>
    <p>લઘુત્તમ માપશક્તિ (Least Count): 0.02 mm</p>
  </div>

  <div class="canvas-card">
    <canvas id="caliperCanvas"></canvas>
  </div>

  <div class="result-card">
    <div class="result-main">
      <span class="result-title">કુલ માપ (Total Reading):</span>
      <span class="result-value" id="totalReading">0.00 mm</span>
    </div>
    
    <div class="calc-row">
      <span>1. મેઇન સ્કેલ રીડિંગ (<span class="highlight-blue">MSR</span>):</span>
      <strong id="msrVal">0.00 mm</strong>
    </div>
    <div class="calc-row">
      <span>2. મેચ થતો કાપો (<span class="highlight-red">VSR Division</span>):</span>
      <strong id="divVal">0 (કાપો)</strong>
    </div>
    <div class="calc-row">
      <span>3. વર્નિયર સ્કેલ રીડિંગ (VSR = કાપો × 0.02):</span>
      <strong id="vsrVal">0.00 mm</strong>
    </div>
  </div>

  <div class="controls">
    <input type="range" id="slider" class="slider" min="0" max="40" step="0.02" value="0.00">
    
    <div class="btn-grid">
      <button class="btn" onclick="adjust(-1.00)">-1.00</button>
      <button class="btn" onclick="adjust(-0.02)">-0.02</button>
      <button class="btn" onclick="adjust(0.02)">+0.02</button>
      <button class="btn" onclick="adjust(1.00)">+1.00</button>
    </div>

    <button class="reset-btn" onclick="resetVal()">↺ 0.00 સેટ કરો</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('caliperCanvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slider');

  let val = 0.00;

  function resize() {
    const r = window.devicePixelRatio || 2;
    canvas.width = canvas.clientWidth * r;
    canvas.height = 220 * r;
    ctx.scale(r, r);
    draw();
  }

  window.addEventListener('resize', resize);

  function update(newVal) {
    val = Math.min(Math.max(parseFloat(newVal), 0), 40);
    val = Math.round(val * 50) / 50; // 0.02 ના ગુણાંકમાં રાઉન્ડ
    slider.value = val.toFixed(2);

    const msr = Math.floor(val);
    const vsr = parseFloat((val - msr).toFixed(2));
    const div = Math.round(vsr / 0.02);

    document.getElementById('totalReading').innerText = val.toFixed(2) + " mm";
    document.getElementById('msrVal').innerText = msr.toFixed(2) + " mm";
    document.getElementById('divVal').innerText = div + " મો કાપો";
    document.getElementById('vsrVal').innerText = `${div} × 0.02 = ${vsr.toFixed(2)} mm`;

    draw();
  }

  function adjust(delta) {
    update(val + delta);
  }

  function resetVal() {
    update(0.00);
  }

  slider.addEventListener('input', (e) => update(e.target.value));

  function draw() {
    const w = canvas.clientWidth;
    const h = 220;
    ctx.clearRect(0, 0, w, h);

    const pxPerMM = 16; // ઝૂમ-ઇન કાપા માટે પૂરતી જગ્યા
    const startX = 40;
    const centerLineY = 95; // જ્યાં બંને સ્કેલના કાપા સામસામે મળે છે

    // 1. મેઇન સ્કેલ (ઉપરની પટ્ટી)
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(10, 20, w - 20, 75);
    ctx.strokeStyle = '#64748b';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(10, 20, w - 20, 75);

    // મેઇન સ્કેલ કાપા (નીચેની તરફ આવતા)
    for (let i = 0; i <= 45; i++) {
      let x = startX + (i * pxPerMM);
      if (x < w - 15) {
        let isMajor = i % 10 === 0;
        let isMedium = i % 5 === 0;
        let lineH = isMajor ? 32 : (isMedium ? 22 : 14);

        ctx.beginPath();
        ctx.moveTo(x, centerLineY);
        ctx.lineTo(x, centerLineY - lineH);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = isMajor ? 2 : 1.2;
        ctx.stroke();

        if (isMajor) {
          ctx.fillStyle = '#0f172a';
          ctx.font = 'bold 12px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(i, x, centerLineY - 37);
        }
      }
    }

    // 2. વર્નિયર સ્લાઇડર (નીચેની પટ્ટી)
    let vX = startX + (val * pxPerMM);

    ctx.fillStyle = '#f1f5f9';
    ctx.fillRect(vX - 10, centerLineY, 260, 80);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.strokeRect(vX - 10, centerLineY, 260, 80);

    // વર્નિયર સ્કેલ કાપા (ઉપરની તરફ જતા - Face to Face)
    const activeDiv = Math.round(((val % 1).toFixed(2)) / 0.02);

    for (let j = 0; j <= 50; j++) {
      // 50 વર્નિયર કાપા = 49 mm
      let vx = vX + (j * 0.98 * pxPerMM);
      let isMajor = j % 5 === 0;
      let isMatch = (j === activeDiv);
      let lineH = isMajor ? 30 : 16;

      if (vx < vX + 245) {
        ctx.beginPath();
        ctx.moveTo(vx, centerLineY);
        ctx.lineTo(vx, centerLineY + lineH);

        if (isMatch) {
          ctx.strokeStyle = '#dc2626'; // લાલ ગ્લો
          ctx.lineWidth = 2.8;
        } else {
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = isMajor ? 1.8 : 1.1;
        }
        ctx.stroke();

        // વર્નિયર સ્કેલ અંકો (0 થી 10)
        if (isMajor) {
          ctx.fillStyle = isMatch ? '#dc2626' : '#000000';
          ctx.font = 'bold 11px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(j / 5, vx, centerLineY + 44);
        }

        // મેચ થતા કાપા ઉપર બોક્સ
        if (isMatch) {
          ctx.fillStyle = '#dc2626';
          ctx.fillRect(vx - 14, centerLineY + 52, 28, 16);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('#' + j, vx, centerLineY + 64);
        }
      }
    }

    // 3. ઝીરો પોઇન્ટર તીર (MSR દર્શક)
    ctx.beginPath();
    ctx.moveTo(vX, centerLineY - 2);
    ctx.lineTo(vX - 6, centerLineY - 12);
    ctx.lineTo(vX + 6, centerLineY - 12);
    ctx.closePath();
    ctx.fillStyle = '#dc2626';
    ctx.fill();

    ctx.fillStyle = '#dc2626';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('▼ 0', vX, centerLineY - 15);
  }

  // Initial setup
  setTimeout(() => {
    resize();
    update(0.00);
  }, 50);
</script>

</body>
</html>
