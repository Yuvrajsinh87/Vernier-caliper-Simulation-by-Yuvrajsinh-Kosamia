<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>વર્નિયર કેલિપર સિમ્યુલેટર - Yuvrajsinh Kosamia</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .container {
      background: #ffffff;
      max-width: 850px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      padding: 20px;
      border: 1px solid #cbd5e1;
    }
    .header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 10px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 18px;
      color: #1e293b;
    }
    .instructor-badge {
      background-color: #2563eb;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }
    .mode-container {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #2563eb;
      background: #ffffff;
      color: #2563eb;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.active {
      background: #2563eb;
      color: #ffffff;
    }
    .canvas-container {
      background: #f8fafc;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 300px;
      display: block;
    }
    .calc-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .formula-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
      margin-bottom: 10px;
    }
    .read-box {
      background: #ffffff;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }
    .read-box .label {
      font-size: 11px;
      color: #64748b;
      font-weight: bold;
    }
    .read-box .val {
      font-size: 16px;
      font-weight: bold;
      color: #1e293b;
      margin-top: 4px;
    }
    .total-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #1d4ed8;
    }
    .test-card {
      display: none;
      background: #fffbebfb;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
    .test-input {
      padding: 8px 12px;
      font-size: 16px;
      width: 150px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      text-align: center;
      margin-right: 8px;
    }
    .check-btn {
      padding: 8px 16px;
      background: #059669;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .feedback {
      margin-top: 8px;
      font-weight: bold;
      font-size: 15px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .slider {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #cbd5e1;
      outline: none;
      accent-color: #2563eb;
      cursor: pointer;
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    .btn {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      padding: 8px 0;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #cbd5e1; }
    .btn-reset { background: #fee2e2; color: #dc2626; border-color: #fecaca; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>વર્નિયર કેલિપર સિમ્યુલેટર (Stefanelli Style)</h1>
      <small style="color: #64748b;">Least Count (LC) = 0.02 mm</small>
    </div>
    <div class="instructor-badge">
      Created by Yuvrajsinh Kosamia - ITI Ankleshwar
    </div>
  </div>

  <div class="mode-container">
    <button class="mode-btn active" id="btnPractice" onclick="setMode('practice')">📖 Practice Mode</button>
    <button class="mode-btn" id="btnTest" onclick="setMode('test')">📝 Test Mode</button>
  </div>

  <div class="canvas-container">
    <canvas id="caliperCanvas"></canvas>
  </div>

  <!-- Practice Calculation Display -->
  <div class="calc-card" id="practiceDisplay">
    <div class="formula-grid">
      <div class="read-box">
        <div class="label">1. Main Scale (MSR)</div>
        <div class="val" id="msrTxt">0.00 mm</div>
      </div>
      <div class="read-box">
        <div class="label">2. Vernier Division (VSD)</div>
        <div class="val" id="vsdTxt">0</div>
      </div>
      <div class="read-box">
        <div class="label">3. Least Count (LC)</div>
        <div class="val">0.02 mm</div>
      </div>
    </div>
    <div class="total-box" id="totalTxt">
      માપ = 0.00 + (0 × 0.02) = 0.00 mm
    </div>
  </div>

  <!-- Test Mode Box -->
  <div class="test-card" id="testDisplay">
    <p style="margin-bottom: 8px; font-weight: bold;">કેલિપરનું સાચું માપ શોધો અને નીચે ટાઈપ કરો:</p>
    <input type="number" step="0.02" id="userAns" class="test-input" placeholder="0.00"> mm
    <button class="check-btn" onclick="checkTestAnswer()">Check Answer</button>
    <button class="check-btn" style="background:#2563eb;" onclick="generateTestValue()">Next Question</button>
    <div class="feedback" id="feedbackTxt"></div>
  </div>

  <div class="controls">
    <input type="range" id="slider" class="slider" min="0" max="50" step="0.02" value="0.00">
    <div class="btn-group">
      <button class="btn" onclick="addValue(-1.00)">-1.00</button>
      <button class="btn" onclick="addValue(-0.02)">-0.02</button>
      <button class="btn btn-reset" onclick="resetValue()">0.00</button>
      <button class="btn" onclick="addValue(0.02)">+0.02</button>
      <button class="btn" onclick="addValue(1.00)">+1.00</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('caliperCanvas');
  const ctx = canvas.getContext('2d');
  const slider = document.getElementById('slider');

  let reading = 0.00;
  let currentMode = 'practice';

  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 2;
    canvas.width = canvas.clientWidth * ratio;
    canvas.height = 300 * ratio;
    ctx.scale(ratio, ratio);
    draw();
  }

  window.addEventListener('resize', resizeCanvas);

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btnPractice').classList.toggle('active', mode === 'practice');
    document.getElementById('btnTest').classList.toggle('active', mode === 'test');

    if (mode === 'practice') {
      document.getElementById('practiceDisplay').style.display = 'block';
      document.getElementById('testDisplay').style.display = 'none';
      updateReading(slider.value);
    } else {
      document.getElementById('practiceDisplay').style.display = 'none';
      document.getElementById('testDisplay').style.display = 'block';
      generateTestValue();
    }
  }

  function generateTestValue() {
    let rand = (Math.floor(Math.random() * 2000) * 0.02).toFixed(2);
    updateReading(rand);
    document.getElementById('userAns').value = '';
    document.getElementById('feedbackTxt').innerText = '';
  }

  function checkTestAnswer() {
    let val = parseFloat(document.getElementById('userAns').value);
    let correct = parseFloat(reading.toFixed(2));
    let fb = document.getElementById('feedbackTxt');
    
    if (Math.abs(val - correct) < 0.001) {
      fb.style.color = '#059669';
      fb.innerText = "✅ એકદમ સાચો જવાબ! (Correct Answer)";
    } else {
      fb.style.color = '#dc2626';
      fb.innerText = `❌ ખોટો જવાબ! સાચું માપ ${correct.toFixed(2)} mm છે.`;
    }
  }

  function updateReading(val) {
    reading = Math.min(Math.max(parseFloat(val), 0), 50);
    reading = Math.round(reading * 50) / 50;
    slider.value = reading.toFixed(2);

    const msr = Math.floor(reading);
    const vsr = parseFloat((reading - msr).toFixed(2));
    const vsd = Math.round(vsr / 0.02);

    document.getElementById('msrTxt').innerText = msr.toFixed(2) + " mm";
    document.getElementById('vsdTxt').innerText = vsd;
    document.getElementById('totalTxt').innerText = `માપ = ${msr.toFixed(2)} + (${vsd} × 0.02) = ${reading.toFixed(2)} mm`;

    draw();
  }

  function addValue(delta) { updateReading(reading + delta); }
  function resetValue() { updateReading(0.00); }

  slider.addEventListener('input', (e) => updateReading(e.target.value));

  function draw() {
    const w = canvas.clientWidth;
    const h = 300;
    ctx.clearRect(0, 0, w, h);

    const pxPerMM = 12;
    const originX = 130;
    const mainScaleY = 65;
    const beamH = 45;
    const centerLineY = mainScaleY + beamH;

    // Metallic Gradients (Stefanelli Style)
    let bodyGrad = ctx.createLinearGradient(0, mainScaleY - 40, 0, centerLineY + 120);
    bodyGrad.addColorStop(0, '#f1f5f9');
    bodyGrad.addColorStop(0.5, '#ffffff');
    bodyGrad.addColorStop(1, '#cbd5e1');

    let jawDarkGrad = ctx.createLinearGradient(0, centerLineY, 0, centerLineY + 120);
    jawDarkGrad.addColorStop(0, '#94a3b8');
    jawDarkGrad.addColorStop(1, '#475569');

    // 1. FIXED BEAM & LEFT JAWS
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(10, mainScaleY, w - 20, beamH);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(10, mainScaleY, w - 20, beamH);

    // Fixed Outer Jaw
    ctx.beginPath();
    ctx.moveTo(originX, centerLineY);
    ctx.lineTo(originX, centerLineY + 110);
    ctx.lineTo(originX - 25, centerLineY + 110);
    ctx.lineTo(originX - 45, centerLineY + 30);
    ctx.lineTo(originX - 45, mainScaleY - 45);
    ctx.lineTo(originX - 20, mainScaleY - 45);
    ctx.lineTo(originX - 20, mainScaleY);
    ctx.lineTo(10, mainScaleY);
    ctx.lineTo(10, centerLineY);
    ctx.closePath();
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.stroke();

    // Fixed Jaw Tip Accent
    ctx.fillStyle = jawDarkGrad;
    ctx.fillRect(originX - 25, centerLineY + 85, 25, 25);

    // Fixed Inner Jaw (Top Sharp Tip)
    ctx.beginPath();
    ctx.moveTo(originX - 20, mainScaleY - 45);
    ctx.lineTo(originX - 10, mainScaleY - 90);
    ctx.lineTo(originX, mainScaleY - 45);
    ctx.closePath();
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.stroke();

    // Branding on Fixed Beam
    ctx.fillStyle = '#0f172a';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'left';
    ctx.fillText("Created by Yuvrajsinh Kosamia", 15, mainScaleY - 25);
    ctx.fillText("ITI Ankleshwar", 15, mainScaleY - 12);

    // MAIN SCALE GRADUATIONS (Facing Downward)
    for (let i = 0; i <= 60; i++) {
      let x = originX + (i * pxPerMM);
      if (x < w - 20) {
        let isMajor = i % 10 === 0;
        let isMedium = i % 5 === 0;
        let lineH = isMajor ? 24 : (isMedium ? 16 : 10);

        ctx.beginPath();
        ctx.moveTo(x, centerLineY);
        ctx.lineTo(x, centerLineY - lineH);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = isMajor ? 1.8 : 1;
        ctx.stroke();

        if (isMajor) {
          ctx.fillStyle = '#000000';
          ctx.font = 'bold 13px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(i / 10, x, centerLineY - 28);
        }
      }
    }

    // 2. MOVABLE SLIDER & RIGHT JAWS
    let slideX = originX + (reading * pxPerMM);

    // Slider Body
    ctx.beginPath();
    ctx.moveTo(slideX - 20, mainScaleY - 5);
    ctx.lineTo(slideX + 180, mainScaleY - 5);
    ctx.lineTo(slideX + 180, centerLineY + 30);
    ctx.lineTo(slideX + 25, centerLineY + 30);
    ctx.lineTo(slideX, centerLineY + 110);
    ctx.lineTo(slideX - 25, centerLineY + 110);
    ctx.lineTo(slideX - 20, mainScaleY - 5);
    ctx.closePath();
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Movable Jaw Tip Accent
    ctx.fillStyle = jawDarkGrad;
    ctx.fillRect(slideX - 25, centerLineY + 85, 25, 25);

    // Movable Top Inner Jaw
    ctx.beginPath();
    ctx.moveTo(slideX + 10, mainScaleY - 45);
    ctx.lineTo(slideX + 25, mainScaleY - 90);
    ctx.lineTo(slideX + 40, mainScaleY - 45);
    ctx.closePath();
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.stroke();

    // Lock Screw (Top Knurled Screw)
    ctx.fillStyle = '#64748b';
    ctx.fillRect(slideX + 60, mainScaleY - 18, 20, 13);
    ctx.strokeRect(slideX + 60, mainScaleY - 18, 20, 13);

    // Thumb Grip (Bottom Curved Finger Rest Bar)
    ctx.beginPath();
    ctx.arc(slideX + 140, centerLineY + 30, 18, 0, Math.PI);
    ctx.fillStyle = jawDarkGrad;
    ctx.fill();
    ctx.stroke();

    // Vernier Window Frame
    const winW = 160;
    const winH = 30;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(slideX, centerLineY, winW, winH);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 1.2;
    ctx.strokeRect(slideX, centerLineY, winW, winH);

    // VERNIER SCALE GRADUATIONS (50 divisions = 49 mm)
    const activeDiv = Math.round(((reading % 1).toFixed(2)) / 0.02);

    for (let j = 0; j <= 50; j++) {
      let vx = slideX + (j * 0.98 * (pxPerMM / 5));
      if (vx <= slideX + winW) {
        let isMajor = j % 5 === 0;
        let lineH = isMajor ? 18 : 10;
        let isMatch = (j === activeDiv);

        ctx.beginPath();
        ctx.moveTo(vx, centerLineY);
        ctx.lineTo(vx, centerLineY + lineH);
        
        ctx.strokeStyle = isMatch ? '#dc2626' : '#000000';
        ctx.lineWidth = isMatch ? 2.5 : (isMajor ? 1.4 : 0.9);
        ctx.stroke();

        if (isMajor) {
          ctx.fillStyle = isMatch ? '#dc2626' : '#000000';
          ctx.font = 'bold 10px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(j / 5, vx, centerLineY + 25);
        }
      }
    }
  }

  setTimeout(() => {
    resizeCanvas();
    updateReading(0.00);
  }, 100);
</script>

</body>
</html>
